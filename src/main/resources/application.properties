# Database Configuration — SQLite
spring.datasource.url=jdbc:sqlite:src/SQL/chica_go.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQLite is single-writer — keep pool size at 1 to avoid locking errors
spring.datasource.hikari.maximum-pool-size=1

# External API Configuration
# Overpass API for CTA stations
overpass.api.url=https://overpass-api.de/api/interpreter

# Geofencing Configuration (distance in meters)
geofence.radius.meters=150

# Google Maps API (loaded from src/api-keys/google-maps file)
google.maps.api.url=https://maps.googleapis.com/maps/api

# Logging
logging.level.com.hackathon.chica_go=DEBUG




