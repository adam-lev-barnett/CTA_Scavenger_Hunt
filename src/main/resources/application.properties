# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/chica_go
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# External API Configuration
# Overpass API for CTA stations
overpass.api.url=https://overpass-api.de/api/interpreter

# Geofencing Configuration (distance in meters)
geofence.radius.meters=150

# Google Maps API (loaded from src/api-keys/google-maps file)
google.maps.api.url=https://maps.googleapis.com/maps/api

# Logging
logging.level.com.hackathon.chica_go=DEBUG


