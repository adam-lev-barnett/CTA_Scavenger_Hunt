# Database Configuration
spring.datasource.url=jdbc:sqlite:chica_go.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# External API Configuration
# Overpass API for CTA stations
overpass.api.url=https://overpass-api.de/api/interpreter

# Geofencing Configuration (distance in meters)
# !! When updating, need to update GeofencingService.java for distance validation
geofence.radius.meters=600

# Google Maps API (loaded from src/api-keys/google-maps file)
google.maps.api.url=https://maps.googleapis.com/maps/api

# CORS
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:5174

# Logging
logging.level.com.hackathon.chica_go=DEBUG

# JWT Configuration
jwt.secret=change-this-to-a-secure-32-byte-minimum-secret-value
jwt.expiration-seconds=86400


